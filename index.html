<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#6B8F71" />
  <title>Мой маленький друг</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=KoHo:wght@400;500;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div class="linen" aria-hidden="true"></div>

    <div class="device" id="device">
      <div class="device-shine" aria-hidden="true"></div>
      <header class="device-top">
        <p class="brand">карманный театр</p>
        <h1>Мой маленький друг</h1>
        <div class="top-tools">
          <span class="clock" id="clock" aria-live="polite">утро</span>
          <span class="stars" id="stars" title="Звёздочки">★ 0</span>
          <button type="button" class="icon-btn" id="btn-sound" aria-label="Звук" title="Звук">♪</button>
          <button type="button" class="icon-btn" id="btn-help" aria-label="Как играть" title="Как играть">?</button>
        </div>
      </header>

      <div class="screen" id="screen" data-time="day">
        <div class="pet-nameplate" id="pet-label" hidden></div>

        <div class="room" id="room">
          <div class="room-photo" id="window-glass">
            <img class="room-photo-img" src="assets/panoramic-room.png" alt="Панорамная комната с видом на лес" />
            <div class="stars-sky" id="stars-sky"></div>
            <div class="window-moon" aria-hidden="true"></div>
            <div class="rain" id="rain"></div>
            <div class="snow" id="snow"></div>
            <div class="bird" id="bird"></div>
          </div>

          <div class="ceiling"></div>
          <div class="wall" id="wall"></div>
          <div class="floor"></div>
          <div class="floor-shadow"></div>

          <div class="room-stage">
            <div class="fridge" aria-hidden="true">
              <span class="box-top"></span>
              <span class="box-side"></span>
              <div class="fridge-freezer"></div>
              <div class="fridge-body"></div>
              <div class="fridge-handle"></div>
            </div>
            <div class="upper-cabs" aria-hidden="true">
              <i></i><i></i><i></i>
            </div>
            <div class="kitchen-set" aria-hidden="true">
              <span class="box-side"></span>
              <div class="counter-top"></div>
              <div class="sink">
                <div class="faucet"></div>
              </div>
              <div class="stove"><i></i><i></i></div>
              <div class="cupboards"><i></i><i></i></div>
            </div>
            <div class="wardrobe" aria-hidden="true">
              <i></i><i></i>
            </div>

            <div class="scene-plant plant-left" aria-hidden="true">
              <span class="frond f1"></span>
              <span class="frond f2"></span>
              <span class="frond f3"></span>
              <span class="pot"></span>
            </div>
            <div class="scene-plant plant-right" aria-hidden="true">
              <span class="frond f1"></span>
              <span class="frond f2"></span>
              <span class="frond f3"></span>
              <span class="pot"></span>
            </div>

          <div class="poster" id="furn-poster" hidden>
            <div class="poster-art"></div>
          </div>
          <div class="lamp" id="furn-lamp" hidden>
            <div class="lamp-arc"></div>
            <div class="lamp-bowl b1"></div>
            <div class="lamp-bowl b2"></div>
            <div class="lamp-stem"></div>
            <div class="lamp-base"></div>
          </div>
          <div class="curtains" id="furn-curtains" hidden>
            <div class="curtain-rod"></div>
            <div class="curtain-panel curtain-left"></div>
            <div class="curtain-panel curtain-right"></div>
          </div>
          <div class="rug" id="furn-rug" hidden></div>
          <div class="floor-plant" id="furn-plant" hidden>
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
            <div class="pot-base"><span class="pot-rim"></span></div>
          </div>
          <div class="cushion" id="furn-cushion" hidden></div>
          <div class="toybox" id="furn-toys" hidden>
            <span class="toy-block"></span>
          </div>
          <div class="fountain" id="furn-fountain" hidden>
            <div class="water-bowl"></div>
          </div>

          <div class="bed" id="bed" data-interact="bed" title="Кроватка">
            <div class="headboard">
              <span class="box-top"></span>
              <span class="box-side"></span>
            </div>
            <div class="mattress">
              <span class="box-top"></span>
              <span class="box-side"></span>
              <div class="duvet"></div>
              <div class="pillow"></div>
            </div>
            <div class="nightstand">
              <span class="box-top"></span>
              <span class="box-side"></span>
              <span class="drawer"></span>
              <div class="orb-lamp"></div>
            </div>
          </div>
          <div class="bowl" id="bowl" data-interact="bowl" title="Мисочка">
            <div class="bowl-food" id="bowl-food"></div>
          </div>
          <div class="ball" id="ball" data-interact="toy" title="Игрушка"></div>

          <div class="egg" id="egg" data-interact="egg">
            <div class="egg-shell"></div>
            <div class="egg-shine"></div>
            <div class="egg-cracks" id="egg-cracks"></div>
            <div class="egg-warmth" id="egg-warmth"></div>
            <div class="egg-hint" id="egg-hint">согрей меня</div>
          </div>

          <div class="actor pet" id="pet" hidden>
            <div class="emotion" id="pet-emotion">♡</div>
            <div class="pet-body" id="pet-body"></div>
          </div>

          <div class="actor caretaker" id="player" data-facing="1">
            <div class="kid">
              <div class="kid-hair"></div>
              <div class="kid-head"></div>
              <div class="kid-body"></div>
              <div class="kid-legs"></div>
            </div>
          </div>

          <div class="speech" id="speech" hidden></div>
          <div class="event-layer" id="event-layer"></div>
          </div>
        </div>

        <div class="vignette"></div>
        <div class="grain"></div>
      </div>

      <div class="hud">
      <div class="needs" id="needs" aria-label="Самочувствие питомца">
        <button type="button" class="need" data-need="hunger" title="Голод">
          <span class="need-icon">🍽</span>
          <span class="need-fill" id="need-hunger"></span>
        </button>
        <button type="button" class="need" data-need="sleep" title="Сон">
          <span class="need-icon">🌙</span>
          <span class="need-fill" id="need-sleep"></span>
        </button>
        <button type="button" class="need" data-need="mood" title="Настроение">
          <span class="need-icon">♥</span>
          <span class="need-fill" id="need-mood"></span>
        </button>
        <button type="button" class="need" data-need="play" title="Игра">
          <span class="need-icon">🪀</span>
          <span class="need-fill" id="need-play"></span>
        </button>
        <button type="button" class="need" data-need="attention" title="Внимание">
          <span class="need-icon">👋</span>
          <span class="need-fill" id="need-attention"></span>
        </button>
      </div>

      <nav class="care-bar" id="care-bar">
        <button type="button" class="care-btn" id="btn-feed">Кормить</button>
        <button type="button" class="care-btn" id="btn-play">Играть</button>
        <button type="button" class="care-btn" id="btn-pet">Гладить</button>
        <button type="button" class="care-btn" id="btn-sleep">Спать</button>
        <button type="button" class="care-btn" id="btn-games">Мини-игры</button>
        <button type="button" class="care-btn" id="btn-shop">Комната</button>
      </nav>

      <div class="touch-pad" id="touch-pad" hidden>
        <div class="dpad">
          <button type="button" class="pad-btn pad-left" data-dir="left" aria-label="Влево">◀</button>
          <button type="button" class="pad-btn pad-jump" data-dir="jump" aria-label="Прыжок">▲</button>
          <button type="button" class="pad-btn pad-right" data-dir="right" aria-label="Вправо">▶</button>
        </div>
        <button type="button" class="pad-action" id="pad-action" aria-label="Действие">●</button>
      </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <script src="js/animals.js"></script>
  <script src="js/state.js"></script>
  <script src="js/world.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
